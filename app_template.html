<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雅思單字複習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAE3F5; --surface:#FFFFFF; --ink:#1E1D24; --muted:#7B7A87; --line:#E9E6F0;
  --dark:#1C1B21; --dark-ink:#FFFFFF;
  --lilac:#DCD1F2; --mint:#D6E9E3; --lemon:#FBE6A3; --sky:#C9D3EF;
  --f0:#EDEBF3; --f1:#FBE6A3; --f2:#C9D3EF; --f3:#CFE8DE;
  --f0-ink:#5A5966; --f1-ink:#5A4300; --f2-ink:#2B3A6B; --f3-ink:#1F5A45;
  --shadow:0 10px 30px rgba(60,40,110,.10);
  --sans:"Poppins","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1826; --surface:#26223A; --ink:#F1EEF8; --muted:#A39FB5; --line:#352F4B;
    --dark:#F1EEF8; --dark-ink:#1B1826;
    --lilac:#3E3560; --mint:#2B4A43; --lemon:#5E4E1E; --sky:#2F3A5E;
    --f0:#332F45; --f1:#5E4E1E; --f2:#2F3A5E; --f3:#2B4A43;
    --f0-ink:#D8D4E6; --f1-ink:#F7E3A1; --f2-ink:#C8D6F5; --f3-ink:#BFEAD6;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#1B1826; --surface:#26223A; --ink:#F1EEF8; --muted:#A39FB5; --line:#352F4B;
  --dark:#F1EEF8; --dark-ink:#1B1826;
  --lilac:#3E3560; --mint:#2B4A43; --lemon:#5E4E1E; --sky:#2F3A5E;
  --f0:#332F45; --f1:#5E4E1E; --f2:#2F3A5E; --f3:#2B4A43;
  --f0-ink:#D8D4E6; --f1-ink:#F7E3A1; --f2-ink:#C8D6F5; --f3-ink:#BFEAD6;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;min-height:42px}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 0 6px}
.brand{font-size:26px;font-weight:600;line-height:1.2;letter-spacing:-.01em}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px}
.tools{display:flex;gap:8px}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--ink);border:1px solid var(--line);background:var(--surface);font-size:18px}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;margin:10px 0 14px}
.tab{padding:8px 16px;border-radius:999px;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--dark);color:var(--dark-ink)}

/* controls */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.row select{flex:1;min-width:140px}
.count{color:var(--muted);font-size:13px;font-weight:500}

/* progress card */
.progress{position:relative;background:var(--lilac);border-radius:26px;padding:16px 18px;margin-bottom:14px;overflow:hidden}
.progress::after{content:"✦";position:absolute;right:16px;top:8px;font-size:22px;color:rgba(255,255,255,.75)}
.progress::before{content:"✦";position:absolute;right:44px;top:34px;font-size:11px;color:rgba(255,255,255,.8)}
.progress .l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-right:44px}
.progress .l1 b{font-weight:600;font-size:17px}
.progress .rounds{color:var(--ink);opacity:.7;font-size:13px;font-weight:500}
.bar{height:10px;background:rgba(255,255,255,.55);border-radius:999px;margin:10px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--dark);border-radius:999px;width:0;transition:width .25s ease}
.progress .l2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px}
.progress .hint{color:var(--ink);opacity:.72;flex:1;min-width:180px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;min-height:44px;font-weight:500}
.btn.primary{background:var(--dark);color:var(--dark-ink);border-color:var(--dark)}
.btn:disabled{opacity:.45;cursor:default}

/* card */
.stage{perspective:1400px;margin-bottom:12px}
.card{display:grid;min-height:320px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
@media (prefers-reduced-motion: reduce){.card{transition:none}}
.face{grid-area:1/1;position:relative;min-height:320px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:28px;padding:22px 22px 20px;display:flex;flex-direction:column;cursor:pointer;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:var(--mint)}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;font-weight:500}
.meta .cat{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.word{font-size:34px;line-height:1.15;font-weight:600;margin:18px 0 2px;word-break:break-word;letter-spacing:-.01em}
.pos{color:var(--muted);font-size:15px;font-weight:500}
.ex{margin-top:auto;padding-top:16px;border-top:1px dashed var(--line);font-size:17px;line-height:1.5;font-weight:500}
.ex-zh{color:var(--muted);font-size:14px;margin-top:6px}
.speak{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-size:13px;font-weight:500;margin-top:10px;padding:8px 14px;border-radius:999px;background:var(--lemon);align-self:flex-start}
.zh{font-size:26px;font-weight:600;margin:14px 0 4px}
.def{color:var(--ink);font-size:15px;line-height:1.55}
.bex{margin-top:14px;padding-top:12px;border-top:1px dashed rgba(0,0,0,.12);font-size:14px;line-height:1.5}
.bex span{display:block;color:var(--ink);opacity:.6;font-size:12px;font-weight:500;margin-bottom:2px}
.face.back .ex-zh{color:var(--ink);opacity:.75;margin-top:2px}
.pairs{margin-top:auto;padding-top:14px;border-top:1px dashed rgba(0,0,0,.12);display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px}
.pairs span{display:block;color:var(--muted);font-size:12px;margin-bottom:2px;font-weight:500}
.face.back .pairs span{color:var(--ink);opacity:.6}
.fam-tag{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500}
.fam-0{background:var(--f0);color:var(--f0-ink)} .fam-1{background:var(--f1);color:var(--f1-ink)}
.fam-2{background:var(--f2);color:var(--f2-ink)} .fam-3{background:var(--f3);color:var(--f3-ink)}

/* rating */
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.rate button{border-radius:18px;padding:12px 4px;min-height:52px;font-size:14px;font-weight:500;border:2px solid transparent}
.rate .r0{background:var(--f0);color:var(--f0-ink)} .rate .r1{background:var(--f1);color:var(--f1-ink)}
.rate .r2{background:var(--f2);color:var(--f2-ink)} .rate .r3{background:var(--f3);color:var(--f3-ink)}
.rate button.on{border-color:var(--ink)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nav .pos-ind{color:var(--muted);font-size:13px;font-weight:500}
.kbd{color:var(--muted);font-size:12px;margin-top:10px}

/* list */
.list-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.list-tools input{grid-column:1/-1}
.tbl{width:100%;border-collapse:separate;border-spacing:0 8px}
.tbl-wrap{overflow-x:auto}
.tbl td{padding:12px 14px;background:var(--surface);vertical-align:top}
.tbl td:first-child{border-radius:20px 0 0 20px}
.tbl td:last-child{border-radius:0 20px 20px 0}
.tbl .w{font-size:17px;font-weight:600}
.tbl .w i{color:var(--muted);font-size:13px;margin-left:6px;font-style:normal;font-weight:500}
.tbl .z{color:var(--muted);font-size:14px}
.tbl select{min-height:36px;padding:5px 12px;font-size:13px}
.tbl .c{color:var(--muted);font-size:12px}
.empty{padding:32px;text-align:center;color:var(--muted);border-radius:20px !important}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(30,20,60,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.open{display:flex}
.panel{background:var(--surface);border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:85vh;overflow:auto}
.panel h2{font-size:20px;margin:0 0 10px;font-weight:600}
.panel p{margin:8px 0;font-size:13px;color:var(--muted)}
.panel .opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.status{font-size:14px;margin-top:10px;min-height:20px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:var(--dark-ink);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
.hidden{display:none !important}
@media (max-width:430px){
  .wrap{padding:10px 12px 32px}
  .brand{font-size:22px}
  .face{padding:18px 18px 16px;border-radius:24px}
  .word{font-size:28px;margin:14px 0 2px}
  .ex{font-size:16px;padding-top:14px}
  .zh{font-size:22px}
  .rate button{font-size:13px;padding:10px 2px;min-height:48px}
  .btn{padding:9px 14px}
  .kbd{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">今天的複習<small id="brandCount"></small></div>
    <div class="tools">
      <button class="icon-btn" id="btnSettings" title="設定與匯出" aria-label="設定與匯出">⚙︎</button>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabCards" aria-selected="true">單字卡</button>
    <button class="tab" role="tab" id="tabList" aria-selected="false">篩選列表</button>
  </div>

  <!-- ===== Cards view ===== -->
  <section id="viewCards">
    <div class="row">
      <select id="deckSel" aria-label="複習範圍"></select>
    </div>

    <div class="progress" id="progressBox">
      <div class="l1"><b id="pTitle"></b><span class="rounds" id="pRounds"></span></div>
      <div class="bar"><i id="pBar"></i></div>
      <div class="l2">
        <span class="hint">不用糾結今天忘記的字，多輪替印象自然會加深。</span>
        <button class="btn" id="btnDone">這份完成了</button>
      </div>
    </div>

    <div class="stage">
      <div class="card" id="card">
        <div class="face front" id="front">
          <div class="meta"><span class="cat" id="fCat"></span><span class="fam-tag" id="fFam"></span></div>
          <div class="word" id="fWord"></div>
          <div class="pos" id="fPos"></div>
          <button class="speak" id="btnSpeak" type="button">🔊 <span id="speakLabel">念一次</span></button>
          <div class="ex" id="fEx"></div>
          <div class="ex-zh" id="fExZh"></div>
        </div>
        <div class="face back" id="back">
          <div class="meta"><span class="cat" id="bWord"></span><span class="fam-tag" id="bFam"></span></div>
          <div class="zh" id="bZh"></div>
          <div class="def" id="bDef"></div>
          <div class="bex"><span>例句</span><div id="bEx"></div><div class="ex-zh" id="bExZh"></div></div>
          <div class="pairs">
            <div><span>同義詞</span><div id="bSyn"></div></div>
            <div><span>反義詞</span><div id="bAnt"></div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="rate" id="rate">
      <button class="r0" data-f="0">未學習</button>
      <button class="r1" data-f="1">學習中</button>
      <button class="r2" data-f="2">熟悉</button>
      <button class="r3" data-f="3">已掌握</button>
    </div>
    <div class="nav">
      <button class="btn" id="btnPrev">上一張</button>
      <span class="pos-ind" id="posInd"></span>
      <button class="btn primary" id="btnNext">下一張 →</button>
    </div>
  </section>

  <!-- ===== List view ===== -->
  <section id="viewList" class="hidden">
    <div class="list-tools">
      <input id="q" type="search" placeholder="搜尋單字或中文" aria-label="搜尋">
      <select id="fCatSel" aria-label="分類"></select>
      <select id="fFamSel" aria-label="熟悉度">
        <option value="">全部熟悉度</option>
        <option value="0">未學習</option><option value="1">學習中</option>
        <option value="2">熟悉</option><option value="3">已掌握</option>
      </select>
    </div>
    <div class="count" id="listCount" style="margin-bottom:8px"></div>
    <div class="tbl-wrap"><table class="tbl" id="tbl"></table></div>
  </section>
</div>

<!-- settings / export sheet -->
<div class="sheet" id="sheet">
  <div class="panel">
    <h2>設定與匯出</h2>
    <div class="opt"><span>發音口音</span>
      <select id="accentSel"><option value="en-GB">英式 (UK)</option><option value="en-US">美式 (US)</option></select>
    </div>
    <div class="opt"><span>本次已更動的熟悉度</span><b id="changedCount">0 字</b></div>
    <div class="opt"><span>資料版本</span><span class="hint" id="dataVer"></span></div>
    <button class="btn primary" id="btnExport" style="width:100%;margin-top:12px">匯出更新後的 Excel</button>
    <div class="status" id="exportStatus"></div>
    <p>匯出後，到 Google 試算表用「檔案 → 匯入 → 上傳 → 取代試算表」，連結不變、內容更新。</p>
    <div class="opt" style="margin-top:6px"><span class="hint">清掉這台裝置上的熟悉度更動（回到匯入時的狀態）</span><button class="btn" id="btnReset">清除</button></div>
    <div class="opt"><span class="hint">重設 7 份輪替進度</span><button class="btn" id="btnResetProg">重設</button></div>
    <button class="btn" id="btnClose" style="width:100%;margin-top:12px">關閉</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== data (injected) ===== */
const META = __META__;
const WORDS = __WORDS__;
const LOG_ROWS = __LOG__;

/* ===== constants ===== */
const FAM = ["未學習","學習中","熟悉","已掌握"];
const PORTION_SIZES = [47,47,47,47,47,46,46];
const PORTION_BOUNDS = (()=>{let a=[],s=0;for(const n of PORTION_SIZES){a.push([s,s+n]);s+=n;}return a;})();
const K_OVR = "iv_overrides_"+META.version, K_PROG="iv_progress", K_PREF="iv_prefs";

/* ===== storage helpers (localStorage is per-device convenience) ===== */
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

let overrides = lsGet(K_OVR,{});          // {idx:{fam,date,cnt}}
let prog = lsGet(K_PROG,{portion:1,rounds:0,seen:{}});
let prefs = lsGet(K_PREF,{accent:"en-GB"});

/* effective word record */
function rec(i){const w=WORDS[i],o=overrides[i];return o?{...w,fam:o.fam,date:o.date,cnt:o.cnt}:w;}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function setFam(i,f){
  const cur=rec(i);
  overrides[i]={fam:f,date:todayStr(),cnt:(cur.cnt||0)+1};
  lsSet(K_OVR,overrides);
  prog.seen[i]=1; lsSet(K_PROG,prog);
}

/* ===== view switching ===== */
const $=id=>document.getElementById(id);
function showTab(t){
  $("tabCards").setAttribute("aria-selected",t==="cards"); $("tabList").setAttribute("aria-selected",t==="list");
  $("viewCards").classList.toggle("hidden",t!=="cards"); $("viewList").classList.toggle("hidden",t!=="list");
  if(t==="list") renderList();
}
$("tabCards").onclick=()=>showTab("cards"); $("tabList").onclick=()=>showTab("list");

/* ===== deck ===== */
const CATS=[...new Set(WORDS.flatMap(w=>w.cat.split("、")))];
let deck=[], pos=0, flipped=false;
function buildDeckSel(){
  const s=$("deckSel"); s.innerHTML="";
  const g1=document.createElement("optgroup"); g1.label="7 份輪替";
  PORTION_BOUNDS.forEach((b,k)=>{const o=document.createElement("option");o.value="p"+(k+1);o.textContent=`第 ${k+1} 份（${b[1]-b[0]} 字）`;g1.appendChild(o);});
  const g2=document.createElement("optgroup"); g2.label="依分類";
  const all=document.createElement("option"); all.value="all"; all.textContent="全部單字"; g2.appendChild(all);
  CATS.forEach(c=>{const o=document.createElement("option");o.value="c:"+c;o.textContent=c;g2.appendChild(o);});
  s.appendChild(g1); s.appendChild(g2);
  s.value="p"+prog.portion;
  s.onchange=()=>{ if(s.value.startsWith("p")){prog.portion=+s.value.slice(1);lsSet(K_PROG,prog);} loadDeck(); };
}
function loadDeck(){
  const v=$("deckSel").value;
  if(v.startsWith("p")){const [a,b]=PORTION_BOUNDS[+v.slice(1)-1];deck=[];for(let i=a;i<b;i++)deck.push(i);}
  else if(v==="all"){deck=WORDS.map((_,i)=>i);}
  else {const c=v.slice(2);deck=WORDS.map((w,i)=>w.cat.split("、").includes(c)?i:-1).filter(i=>i>=0);}
  pos=0; flipped=false; renderCard(); renderProgress();
}
function renderProgress(){
  const v=$("deckSel").value, box=$("progressBox");
  if(!v.startsWith("p")){box.classList.add("hidden");return;}
  box.classList.remove("hidden");
  const k=+v.slice(1), [a,b]=PORTION_BOUNDS[k-1];
  let seen=0; for(let i=a;i<b;i++) if(prog.seen[i]) seen++;
  $("pTitle").textContent=`第 ${k} 份 · 已看 ${seen} / ${b-a}`;
  $("pRounds").textContent=`已完整輪替 ${prog.rounds} 次`;
  $("pBar").style.width=Math.round(seen/(b-a)*100)+"%";
}
$("btnDone").onclick=()=>{
  const k=prog.portion;
  const [a,b]=PORTION_BOUNDS[k-1];
  for(let i=a;i<b;i++) delete prog.seen[i];
  if(k===7){prog.rounds+=1;prog.portion=1;toast(`第 7 份完成，這是第 ${prog.rounds} 輪。從第 1 份重新開始。`);}
  else {prog.portion=k+1;toast(`第 ${k} 份完成，換第 ${k+1} 份。`);}
  lsSet(K_PROG,prog); $("deckSel").value="p"+prog.portion; loadDeck();
};

/* ===== card ===== */
function famTag(el,f){el.textContent=FAM[f];el.className="fam-tag fam-"+f;}
function renderCard(){
  const n=deck.length;
  if(!n){$("fWord").textContent="沒有符合的單字";$("fPos").textContent="";$("fEx").textContent="";$("posInd").textContent="";return;}
  const i=deck[pos], w=rec(i);
  $("card").classList.toggle("flipped",flipped);
  $("fCat").textContent=w.cat; famTag($("fFam"),w.fam);
  $("fWord").textContent=w.w; $("fPos").textContent=w.pos; $("fEx").textContent=w.ex; $("fExZh").textContent=w.exzh;
  $("bWord").textContent=w.w; famTag($("bFam"),w.fam);
  $("bZh").textContent=w.zh; $("bDef").textContent=w.en; $("bEx").textContent=w.ex; $("bExZh").textContent=w.exzh;
  $("bSyn").textContent=w.syn||"—"; $("bAnt").textContent=(w.ant&&w.ant!=="-")?w.ant:"—";
  $("posInd").textContent=`${pos+1} / ${n}`;
  document.querySelectorAll("#rate button").forEach(b=>b.classList.toggle("on",+b.dataset.f===w.fam));
}
function flip(){flipped=!flipped;$("card").classList.toggle("flipped",flipped);if(deck.length){prog.seen[deck[pos]]=1;lsSet(K_PROG,prog);renderProgress();}}
function go(d){if(!deck.length)return;pos=(pos+d+deck.length)%deck.length;flipped=false;renderCard();}
$("front").onclick=e=>{if(e.target.closest("#btnSpeak"))return;flip();};
$("back").onclick=flip;
$("btnPrev").onclick=()=>go(-1); $("btnNext").onclick=()=>go(1);
document.querySelectorAll("#rate button").forEach(b=>b.onclick=()=>{
  if(!deck.length)return; setFam(deck[pos],+b.dataset.f); renderProgress(); updateChanged();
  setTimeout(()=>go(1),160);
});
document.addEventListener("keydown",e=>{
  if($("viewCards").classList.contains("hidden")||$("sheet").classList.contains("open"))return;
  if(e.target.matches("input,select"))return;
  if(e.key===" "){e.preventDefault();flip();}
  else if(e.key==="ArrowLeft")go(-1); else if(e.key==="ArrowRight")go(1);
  else if(/^[1-4]$/.test(e.key)){setFam(deck[pos],+e.key-1);renderProgress();updateChanged();setTimeout(()=>go(1),160);}
});

/* ===== speech ===== */
let voices=[];
function loadVoices(){voices=speechSynthesis.getVoices();}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
else{$("btnSpeak").classList.add("hidden");}
function speak(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang=prefs.accent; u.rate=0.92;
  const pick=voices.find(v=>v.lang.replace("_","-")===prefs.accent)||voices.find(v=>v.lang.startsWith("en"));
  if(pick)u.voice=pick;
  speechSynthesis.speak(u);
}
$("btnSpeak").onclick=e=>{e.stopPropagation();if(deck.length)speak(WORDS[deck[pos]].w);};

/* ===== list ===== */
function buildCatSel(){const s=$("fCatSel");s.innerHTML='<option value="">全部分類</option>'+CATS.map(c=>`<option value="${c}">${c}</option>`).join("");}
function renderList(){
  const q=$("q").value.trim().toLowerCase(), c=$("fCatSel").value, f=$("fFamSel").value;
  const rows=[];
  WORDS.forEach((w0,i)=>{const w=rec(i);
    if(c&&!w.cat.split("、").includes(c))return; if(f!==""&&w.fam!==+f)return;
    if(q&&!(w.w.toLowerCase().includes(q)||w.zh.includes(q)||w.syn.toLowerCase().includes(q)))return;
    rows.push(i);
  });
  $("listCount").textContent=`${rows.length} 字`;
  const t=$("tbl");
  if(!rows.length){t.innerHTML='<tr><td class="empty">沒有符合的單字，換個關鍵字或條件試試。</td></tr>';return;}
  t.innerHTML=rows.map(i=>{const w=rec(i);return `<tr>
    <td><div class="w">${esc(w.w)}<i>${esc(w.pos)}</i></div><div class="z">${esc(w.zh)}</div><div class="c">${esc(w.cat)}</div></td>
    <td style="width:110px;text-align:right"><select data-i="${i}" aria-label="熟悉度">${FAM.map((n,k)=>`<option value="${k}"${k===w.fam?" selected":""}>${n}</option>`).join("")}</select>
      <div class="c">${w.date?esc(w.date):""}</div></td></tr>`;}).join("");
  t.querySelectorAll("select").forEach(s=>s.onchange=()=>{setFam(+s.dataset.i,+s.value);updateChanged();renderList();});
}
function esc(s){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
["q","fCatSel","fFamSel"].forEach(id=>$(id).addEventListener("input",renderList));

/* ===== settings sheet ===== */
$("btnSettings").onclick=()=>{$("sheet").classList.add("open");$("accentSel").value=prefs.accent;updateChanged();};
$("btnClose").onclick=()=>$("sheet").classList.remove("open");
$("sheet").addEventListener("click",e=>{if(e.target===$("sheet"))$("sheet").classList.remove("open");});
$("accentSel").onchange=()=>{prefs.accent=$("accentSel").value;lsSet(K_PREF,prefs);};
$("btnReset").onclick=()=>{if(confirm("清除這台裝置上所有熟悉度更動？"))(overrides={},lsSet(K_OVR,overrides),updateChanged(),renderCard(),renderList(),toast("已清除"));};
$("btnResetProg").onclick=()=>{if(confirm("重設輪替進度（份數與輪數歸零）？"))(prog={portion:1,rounds:0,seen:{}},lsSet(K_PROG,prog),$("deckSel").value="p1",loadDeck(),toast("進度已重設"));};
function updateChanged(){$("changedCount").textContent=Object.keys(overrides).length+" 字";}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200);}

/* ===== export (ExcelJS, loaded on demand) ===== */
let downloadsNS=null, downloadsChecked=false;
async function ensureDownloads(){
  if(downloadsChecked)return downloadsNS; downloadsChecked=true;
  try{ if(window.claude&&window.claude.use) downloadsNS=await window.claude.use("downloads"); }catch(e){downloadsNS=null;}
  return downloadsNS;
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error(src));document.head.appendChild(s);});}
async function ensureExcelJS(){
  if(window.ExcelJS)return;
  try{await loadScript("https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js");}catch(e){}
  if(!window.ExcelJS){await loadScript("https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js");}
  if(!window.ExcelJS)throw new Error("ExcelJS 載入失敗");
}
const HDR={type:"pattern",pattern:"solid",fgColor:{argb:"FF2E5395"}};
const THIN={style:"thin",color:{argb:"FFD9D9D9"}}, BORDER={top:THIN,left:THIN,bottom:THIN,right:THIN};
function hdrRow(ws,rowNo,labels){const r=ws.getRow(rowNo);labels.forEach((h,i)=>{const c=r.getCell(i+1);c.value=h;c.fill=HDR;c.font={name:"Arial",size:11,bold:true,color:{argb:"FFFFFFFF"}};c.alignment={horizontal:"center",vertical:"middle",wrapText:true};c.border=BORDER;});}
async function buildWorkbook(){
  await ensureExcelJS();
  const wb=new ExcelJS.Workbook();
  /* --- 單字庫 --- */
  const ws=wb.addWorksheet("單字庫",{views:[{state:"frozen",xSplit:2,ySplit:1}]});
  const heads=["編號","分類","單字","詞性","中文解釋","英文解釋","例句 (IELTS 7.0)","例句中文","同義詞","反義詞","熟悉度","上次複習日期","複習次數","備註"];
  hdrRow(ws,1,heads);
  ws.columns=[6,14,22,8,16,38,42,34,22,20,10,14,10,20].map(w=>({width:w}));
  WORDS.forEach((w0,i)=>{const w=rec(i);const r=ws.getRow(i+2);
    const vals=[i+1,w.cat,w.w,w.pos,w.zh,w.en,w.ex,w.exzh,w.syn,w.ant,FAM[w.fam],w.date?new Date(w.date+"T00:00:00"):null,w.cnt||0,w.note||null];
    vals.forEach((v,k)=>{const c=r.getCell(k+1);c.value=v;c.font={name:"Arial",size:10};c.border=BORDER;
      if([5,6,7,8].includes(k+1))c.alignment={wrapText:true,vertical:"top"};
      else if([1,4,11,13].includes(k+1))c.alignment={horizontal:"center",vertical:"top"};
      else c.alignment={vertical:"top",wrapText:true};
      if(k+1===12)c.numFmt="yyyy-mm-dd";});
  });
  const last=WORDS.length+1, rng=`K2:K${last+500}`;
  ws.autoFilter=`A1:N${last}`;
  ws.dataValidations.add(rng,{type:"list",allowBlank:true,formulae:['"未學習,學習中,熟悉,已掌握"'],showErrorMessage:true,errorTitle:"輸入錯誤",error:"請從清單選擇：未學習／學習中／熟悉／已掌握"});
  const fill=a=>({type:"pattern",pattern:"solid",bgColor:{argb:a}});
  ws.addConditionalFormatting({ref:rng,rules:[
    {type:"cellIs",operator:"equal",formulae:['"未學習"'],style:{fill:fill("FFFCE4E4")}},
    {type:"cellIs",operator:"equal",formulae:['"學習中"'],style:{fill:fill("FFFFF2CC")}},
    {type:"cellIs",operator:"equal",formulae:['"熟悉"'],style:{fill:fill("FFDDEBF7")}},
    {type:"cellIs",operator:"equal",formulae:['"已掌握"'],style:{fill:fill("FFD9EAD3")}}]});
  /* --- 複習紀錄 --- */
  const w2=wb.addWorksheet("複習紀錄");
  const end=last+500, L=(r,a,b)=>{w2.getCell(r,1).value=a;w2.getCell(r,1).font={name:"Arial",size:10,bold:true};const c=w2.getCell(r,2);c.value=b;c.font={name:"Arial",size:12,bold:true,color:{argb:"FF2E5395"}};c.alignment={horizontal:"center"};};
  w2.getCell(1,1).value="單字進步系統儀表板";w2.getCell(1,1).font={name:"Arial",size:14,bold:true,color:{argb:"FF2E5395"}};w2.mergeCells("A1:E1");
  L(3,"總單字數",{formula:`COUNTA('單字庫'!C2:C${end})`});
  L(4,"未學習",{formula:`COUNTIF('單字庫'!K2:K${end},"未學習")`});
  L(5,"學習中",{formula:`COUNTIF('單字庫'!K2:K${end},"學習中")`});
  L(6,"熟悉",{formula:`COUNTIF('單字庫'!K2:K${end},"熟悉")`});
  L(7,"已掌握",{formula:`COUNTIF('單字庫'!K2:K${end},"已掌握")`});
  L(8,"掌握率（已掌握 / 總單字數）",{formula:"IFERROR(B7/B3,0)"}); w2.getCell(8,2).numFmt="0.0%";
  w2.getCell(10,1).value="使用方式：在複習網頁更新熟悉度後匯出、取代這份試算表，此處數字會自動更新。";w2.getCell(10,1).font={name:"Arial",size:9,italic:true,color:{argb:"FF808080"}};w2.mergeCells("A10:G10");
  w2.getCell(12,1).value="7 份輪替複習紀錄（327 字分 7 份，一天一份；7 份跑完＝1 輪）";w2.getCell(12,1).font={name:"Arial",size:11,bold:true};w2.mergeCells("A12:G12");
  hdrRow(w2,13,["輪次","份數（1–7）","日期","本次複習單字數","花費時間（分鐘）","備註"]);
  const logRows=LOG_ROWS.length?LOG_ROWS:[];
  for(let i=0;i<20;i++){const r=w2.getRow(14+i);const src=logRows[i]||[];for(let c=1;c<=6;c++){const cell=r.getCell(c);cell.value=src[c-1]??null;cell.font={name:"Arial",size:10};cell.border=BORDER;if(c===3)cell.numFmt="yyyy-mm-dd";}}
  w2.columns=[28,16,12,16,16,30].map(w=>({width:w}));
  /* --- 使用說明 --- */
  const w3=wb.addWorksheet("使用說明"); w3.columns=[{width:100}];
  const lines=[["單字進步系統 — 使用說明",{size:14,bold:true,color:{argb:"FF2E5395"}}],[""],
    ["【工作表說明】",{bold:true}],
    [`1. 單字庫：${WORDS.length} 個獨立單字（來自《Pin IELTS 雅思單字本》），含詞性、中英文解釋、例句、同義詞、反義詞、熟悉度、上次複習日期、複習次數。`],
    ["2. 複習紀錄：自動統計各熟悉度單字數量與掌握率，並附 7 份輪替的複習紀錄表。"],
    ["3. 使用說明：本頁。"],[""],
    ["【複習方式（7 份輪替）】",{bold:true}],
    ["・327 字依原書順序切成 7 份（每份 46–47 字），一天複習一份，跑完 7 份算一輪。"],
    ["・原則是快速、大量、多次：每個字不要過度糾結，隔天忘記是正常的，輪替次數越多印象越深。"],
    ["・複習時在網頁上點熟悉度（未學習／學習中／熟悉／已掌握），網頁會自動記上次複習日期並把複習次數 +1。"],[""],
    ["【與網頁同步】",{bold:true}],
    ["・網頁匯出「更新後的 Excel」後，在這份 Google 試算表用「檔案 → 匯入 → 上傳 → 取代試算表」，連結不變、內容更新。"],
    ["・複習紀錄表請在取代之後再填寫新的一列，避免被覆蓋。"],
    ["・要新增單字時，先在這裡的單字庫最後一列加入，再請 Claude 重新產生網頁。"]];
  lines.forEach((l,i)=>{const c=w3.getCell(i+1,1);c.value=l[0];c.font={name:"Arial",size:10,...(l[1]||{})};c.alignment={wrapText:true,vertical:"top"};});
  return wb;
}
$("btnExport").onclick=async()=>{
  const st=$("exportStatus"); st.textContent="正在產生檔案…";
  try{
    const dl=await ensureDownloads();
    const wb=await buildWorkbook();
    const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    if(dl){ await dl.save({filename:"雅思單字進步系統.xlsx",data:blob}); }
    else { /* local / self-hosted: plain browser download */
      const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="雅思單字進步系統.xlsx";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
    st.textContent="已匯出。接著到 Google 試算表匯入並「取代試算表」。";
  }catch(e){
    const code=e&&e.code;
    if(code==="declined")st.textContent="已取消匯出。";
    else if(code==="rate_limited")st.textContent="稍等一下再按一次。";
    else st.textContent="匯出失敗："+(e&&e.message?e.message:"未知錯誤");
  }
};

/* ===== init ===== */
$("brandCount").textContent=`雅思單字 · ${WORDS.length} 字`;
$("dataVer").textContent=META.version;
buildDeckSel(); buildCatSel(); loadDeck(); updateChanged();
</script>
