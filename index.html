<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雅思單字複習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141413">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="雅思單字">
<style>
/* Dark-only theme: charcoal + a single lime accent. Familiarity reads as "the greener, the better". */
:root{
  color-scheme:dark;
  --bg:#141413; --surface:#222220; --surface-2:#2C2C29; --line:#3A3A36;
  --ink:#F3F3EC; --muted:#8E8E86; --on-accent:#141413;
  --lime:#E2F46A; --lime-2:#ECF8A8; --lime-3:#F6FBDD; --paper:#FAFAF4;
  --f0:#3A3A36; --f0-ink:#C9C9C0;
  --f1:var(--lime-3); --f2:var(--lime-2); --f3:var(--lime); --f-ink:var(--on-accent);
  --grad:linear-gradient(135deg,var(--paper) 0%,var(--lime-3) 38%,var(--lime) 100%);
  --r:26px; --r-big:72px;
  --shadow:0 18px 40px rgba(0,0,0,.45);
  --display:"Bricolage Grotesque","Noto Sans TC",system-ui,sans-serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-tap-highlight-color:transparent;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
select,input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;min-height:42px}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 40px}
.hidden{display:none !important}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* header + tabs */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 6px}
.brand{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.brand small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:500;margin-top:4px;letter-spacing:0}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);font-size:20px}
.tabs{display:inline-flex;background:var(--surface);border-radius:999px;padding:4px;margin:12px 0 16px}
.tab{padding:8px 18px;border-radius:999px;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--paper);color:var(--on-accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:10px 18px;min-height:44px;font-weight:500}
.btn.primary{background:var(--lime);color:var(--on-accent);border-color:var(--lime);font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.hint{color:var(--muted);font-size:13px}
.sync{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.ic{width:1em;height:1em;fill:currentColor;flex:none;vertical-align:-0.125em}

/* home: week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;border-radius:999px;border:1.5px solid transparent;color:var(--muted)}
.day small{font-size:11px;font-weight:500}
.day b{font-family:var(--display);font-size:17px;font-weight:600;color:var(--ink);width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.day i{width:6px;height:6px;border-radius:50%;background:transparent}
.day.is-today b{background:var(--paper);color:var(--on-accent)}
.day.is-sel{border-color:var(--lime)}
.day.st-done i{background:var(--lime)}
.day.st-missed i{box-shadow:inset 0 0 0 1.5px var(--muted)}

/* home: hero card */
.hero{position:relative;overflow:hidden;background:var(--grad);color:var(--on-accent);border-radius:var(--r) var(--r) var(--r-big) var(--r);padding:20px 20px 22px;margin-bottom:10px}
.hero-no{position:absolute;right:14px;top:-18px;font-family:var(--display);font-size:128px;font-weight:800;line-height:1;color:rgba(20,20,19,.07);pointer-events:none}
.hero-top{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.hero-num{display:flex;align-items:baseline;gap:6px;margin:10px 0 12px}
.hero-num b{font-size:56px;font-weight:700;line-height:.9}
.hero-num span{font-size:22px;font-weight:600;opacity:.55}
.hero-num small{font-size:13px;font-weight:600;opacity:.7;margin-left:4px}
.hbar{height:12px;border-radius:999px;background:rgba(20,20,19,.12);overflow:hidden;margin-bottom:16px}
.hbar i{display:block;height:100%;width:0;border-radius:999px;background:var(--on-accent);transition:width .4s cubic-bezier(.2,.7,.2,1)}
.hero .btn.primary{background:var(--on-accent);color:var(--lime);border-color:var(--on-accent)}

/* home: KPI boxes */
.box{background:var(--surface);border-radius:var(--r);padding:16px 16px 18px;margin-bottom:10px}
.box-streak{border-top-left-radius:var(--r-big)}
.box-fam{border-bottom-right-radius:var(--r-big)}
.kpi{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.kpi small{font-size:14px;font-weight:600}
.kpi div{display:flex;align-items:baseline;gap:4px}
.kpi b{font-size:40px;font-weight:700;line-height:1;color:var(--lime)}
.kpi span{font-size:13px;color:var(--muted)}
.box > .hint{margin:4px 0 14px;font-size:12px}
.box-streak .kpi{margin-bottom:14px}
.box-streak .kpi small{padding-left:6px}

/* contribution-style heatmap: rows Mon..Sun, one column per week */
.heat{display:grid;grid-template-columns:18px repeat(var(--weeks),minmax(0,1fr));grid-template-rows:14px repeat(7,1fr);gap:3px;font-size:10px;color:var(--muted)}
.heat .ml{grid-row:1;white-space:nowrap;line-height:14px;overflow:visible;min-width:0}
.heat .dl{grid-column:1;line-height:1;align-self:center}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface-2)}
.heat i.pre,.heat i.future{background:#1B1B19}
.heat i.missed{background:transparent;box-shadow:inset 0 0 0 1.5px #6A6A63}
.heat i.today{box-shadow:inset 0 0 0 1.5px var(--lime)}
.heat i.done{background:var(--lime-2)}
.heat i.more{background:var(--lime)}
.heat-legend{display:flex;justify-content:flex-end;gap:12px;margin-top:10px;font-size:11px;color:var(--muted)}
.heat-legend span{display:inline-flex;align-items:center;gap:5px}
.heat-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.h-missed{box-shadow:inset 0 0 0 1.5px #6A6A63} .h-done{background:var(--lime-2)} .h-more{background:var(--lime)}

/* familiarity bars: greener = more familiar */
.fam-bars{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;height:170px;align-items:end}
.fam-bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:8px}
.fam-bar i{font-style:normal;width:100%;max-width:58px;border-radius:999px;display:flex;justify-content:center;min-height:36px;transition:height .5s cubic-bezier(.2,.7,.2,1)}
.fam-bar i b{font-family:var(--display);font-size:15px;font-weight:700;margin-top:10px}
.fam-bar small{font-size:12px;color:var(--muted);white-space:nowrap}
.fam-bar.f0 i{background:var(--f0);color:var(--f0-ink)}
.fam-bar.f1 i{background:var(--f1);color:var(--f-ink)}
.fam-bar.f2 i{background:var(--f2);color:var(--f-ink)}
.fam-bar.f3 i{background:var(--f3);color:var(--f-ink)}
@media (prefers-reduced-motion: reduce){.fam-bar i{transition:none}}
.home-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:500;padding:4px 4px 0}

/* cards */
.cards-top{display:flex;align-items:center;gap:10px;padding:8px 0 4px}
.cards-top b{flex:1;min-width:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbar{height:8px;background:var(--surface);border-radius:999px;margin:8px 0 14px;overflow:hidden}
.cbar i{display:block;height:100%;background:var(--lime);border-radius:999px;width:0;transition:width .25s ease}
#viewCards{overflow-x:clip}
.swipe{touch-action:pan-y;user-select:none;-webkit-user-select:none;margin-bottom:12px}
.stage{perspective:1400px}
.card{display:grid;min-height:320px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.card.no-anim{transition:none}
@media (prefers-reduced-motion: reduce){.card,.hbar i{transition:none}}
.face{grid-area:1/1;position:relative;min-height:320px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:var(--r) var(--r) 44px var(--r);padding:22px 22px 26px;display:flex;flex-direction:column;cursor:pointer;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:var(--lime-3);color:var(--on-accent);border-radius:var(--r) var(--r) var(--r) 44px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:500}
.face.back .meta{color:rgba(20,20,19,.55)}
.meta .cat{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.word{font-family:var(--display);font-size:36px;line-height:1.08;font-weight:700;margin:18px 0 4px;word-break:break-word;letter-spacing:-.02em}
.pos{color:var(--muted);font-size:15px;font-weight:500}
.ex{margin-top:auto;padding-top:16px;border-top:1px dashed var(--line);font-size:17px;line-height:1.5;font-weight:500}
.ex-zh{color:var(--muted);font-size:14px;margin-top:6px}
.speak{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;margin-top:12px;padding:8px 14px;border-radius:999px;background:var(--surface-2);color:var(--lime);align-self:flex-start}
.zh{font-size:26px;font-weight:700;margin:14px 0 4px}
.def{font-size:15px;line-height:1.55}
.bex{margin:14px 0 14px;padding-top:12px;border-top:1px dashed rgba(20,20,19,.18);font-size:14px;line-height:1.5}
.bex span{display:block;opacity:.55;font-size:12px;font-weight:500;margin-bottom:2px}
.face.back .ex-zh{color:var(--on-accent);opacity:.7;margin-top:2px}
.pairs{margin-top:auto;padding-top:14px;border-top:1px dashed rgba(20,20,19,.18);display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px}
.pairs span{display:block;opacity:.55;font-size:12px;margin-bottom:2px;font-weight:500}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
/* unselected = outline; selected this round = solid fill, greener = more familiar */
.rate button{border-radius:18px;padding:12px 4px;min-height:52px;font-size:14px;font-weight:600;background:transparent;border:1.5px solid var(--line);color:var(--ink);touch-action:manipulation;transition:background .15s,border-color .15s,color .15s}
.rate .r0.on{background:var(--f0);border-color:var(--f0);color:var(--f0-ink)}
.rate .r1.on{background:var(--f1);border-color:var(--f1);color:var(--f-ink)}
.rate .r2.on{background:var(--f2);border-color:var(--f2);color:var(--f-ink)}
.rate .r3.on{background:var(--f3);border-color:var(--f3);color:var(--f-ink)}
.nav{display:none;justify-content:space-between;align-items:center;gap:8px}
.nav .btn{display:none}
.pos-ind{color:var(--muted);font-size:13px;font-weight:500}
.kbd{display:none;color:var(--muted);font-size:12px;margin-top:10px;text-align:center}
@media (min-width:768px){.nav{display:flex}.nav .btn{display:inline-flex}.kbd{display:block}}
.done-card{background:var(--grad);color:var(--on-accent);border-radius:var(--r) var(--r) var(--r-big) var(--r);padding:32px 22px;text-align:center}
.done-card h2{font-family:var(--display);font-size:28px;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
.done-card p{opacity:.7;margin:0 0 18px}
.done-card .btn{width:100%;margin-top:8px;background:rgba(20,20,19,.08);border-color:rgba(20,20,19,.15);color:var(--on-accent)}
.done-card .btn.primary{background:var(--on-accent);border-color:var(--on-accent);color:var(--lime)}
.speak .ic,.btn .ic{font-size:1.1em}

/* list */
.list-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.list-tools input,.list-tools .btn{grid-column:1/-1}
.count{color:var(--muted);font-size:13px;font-weight:500;margin-bottom:8px}
.tbl{width:100%;border-collapse:separate;border-spacing:0 8px}
.tbl td{padding:12px 14px;background:var(--surface);vertical-align:top}
.tbl td:first-child{border-radius:20px 0 0 20px}
.tbl td:last-child{border-radius:0 20px 20px 0}
.tbl .w{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.01em}
.tbl .w i{color:var(--muted);font-family:var(--sans);font-size:13px;margin-left:6px;font-style:normal;font-weight:500}
.tbl .z{color:var(--muted);font-size:14px}
.tbl select{min-height:36px;padding:5px 12px;font-size:13px;background:var(--surface-2)}
.tbl .c{color:var(--muted);font-size:12px}
.empty{padding:32px;text-align:center;color:var(--muted);border-radius:20px !important}

/* setup, settings sheet, toast */
.setup{background:var(--surface);border-radius:var(--r) var(--r) var(--r-big) var(--r);padding:24px 20px 28px;margin-top:40px}
.setup h1{font-family:var(--display);font-size:24px;margin:0 0 6px;font-weight:700}
.setup input{width:100%;margin:12px 0}
.setup .btn{width:100%}
.msg{color:var(--lime);font-size:14px;min-height:20px;margin-top:8px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.open{display:flex}
.panel{background:var(--surface);border-radius:28px 28px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:560px;max-height:85vh;overflow:auto}
.panel h2{font-family:var(--display);font-size:22px;margin:0 0 10px;font-weight:700}
.panel p{margin:8px 0;font-size:13px;color:var(--muted)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.opt input{flex:1;min-width:0}
.full{width:100%;margin-top:12px}
.status{font-size:14px;margin-top:10px;min-height:20px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--lime);color:var(--on-accent);font-weight:600;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;white-space:nowrap}
.toast.show{opacity:1}

/* launch splash: the icon's grid lights up cell by cell, then fades into the app */
#splash{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s ease}
#splash.out{opacity:0;pointer-events:none}
.sgrid{display:grid;grid-template-columns:repeat(3,46px);gap:10px;transition:transform .4s cubic-bezier(.2,.7,.2,1)}
#splash.out .sgrid{transform:scale(1.12)}
.sgrid i{width:46px;height:46px;border-radius:13px;background:var(--surface-2);animation:light .38s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d)}
@keyframes light{0%{background:var(--surface-2);transform:scale(.72)}60%{transform:scale(1.06)}100%{background:var(--c);transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.sgrid i{animation:none;background:var(--c)}}

/* entrance: stagger the home blocks once */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#viewHome.enter > *{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
#viewHome.enter > :nth-child(2){animation-delay:.06s}
#viewHome.enter > :nth-child(3){animation-delay:.12s}
#viewHome.enter > :nth-child(4){animation-delay:.18s}
#viewHome.enter > :nth-child(5){animation-delay:.24s}
@media (prefers-reduced-motion: reduce){#viewHome.enter > *{animation:none}}

@media (max-width:430px){
  input,select,.tbl select{font-size:16px}
  .wrap{padding:10px 16px 32px}
  .brand{font-size:23px}
  .hero-num b{font-size:50px}
  .face{padding:18px 18px 24px}
  .word{font-size:30px;margin:14px 0 2px}
  .ex{font-size:16px;padding-top:14px}
  .zh{font-size:22px}
  .rate button{font-size:13px;padding:10px 2px;min-height:48px}
}
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="sgrid">
    <i style="--c:var(--surface-2);--d:0s"></i><i style="--c:var(--lime-2);--d:.18s"></i><i style="--c:var(--lime);--d:.36s"></i>
    <i style="--c:var(--lime-2);--d:.09s"></i><i style="--c:var(--lime);--d:.27s"></i><i style="--c:var(--lime);--d:.45s"></i>
    <i style="--c:var(--surface-2);--d:0s"></i><i style="--c:var(--lime);--d:.54s"></i><i style="--c:var(--paper);--d:.63s"></i>
  </div>
</div>
<div class="wrap">

  <!-- ===== first-run / error: enter sync code ===== -->
  <section id="viewSetup" class="setup hidden">
    <h1>輸入同步碼</h1>
    <p class="hint">同步碼是你在 Apps Script「指令碼屬性」設定的 TOKEN。只會存在這台裝置。</p>
    <input id="setupIn" type="password" autocomplete="off" placeholder="同步碼" aria-label="同步碼">
    <button class="btn primary" id="btnSetup">開始使用</button>
    <div class="msg" id="setupMsg"></div>
  </section>

  <!-- ===== home + list ===== -->
  <div id="main" class="hidden">
    <div class="top">
      <div class="brand">雅思單字<small id="brandCount"></small></div>
      <button class="icon-btn" id="btnSettings" title="設定" aria-label="設定"><span data-icon="setting"></span></button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabHome" aria-selected="true">首頁</button>
      <button class="tab" role="tab" id="tabList" aria-selected="false">篩選列表</button>
    </div>

    <section id="viewHome">
      <div class="week" id="week" role="group" aria-label="本輪 7 天"></div>
      <div class="hero">
        <span class="hero-no num" id="hNo" aria-hidden="true"></span>
        <div class="hero-top"><span id="hLabel"></span></div>
        <div class="hero-num num"><b id="hNum"></b><span id="hDen"></span><small>已評</small></div>
        <div class="hbar"><i id="hBar"></i></div>
        <button class="btn primary" id="btnStart"></button>
      </div>
      <div class="box box-streak">
        <div class="kpi"><small>連續完成</small><div><b class="num" id="sStreak"></b><span>天</span></div></div>
        <div class="heat" id="heat" role="img"></div>
        <div class="heat-legend"><span><i class="h-missed"></i>沒完成</span><span><i class="h-done"></i>完成</span><span><i class="h-more"></i>補做多份</span></div>
      </div>
      <div class="box box-fam">
        <div class="kpi"><small>掌握率</small><div><b class="num" id="sMastery"></b><span>%</span></div></div>
        <div class="hint" id="famSub"></div>
        <div class="fam-bars" id="famBars"></div>
      </div>
      <div class="home-foot"><span></span><span class="sync" id="syncHome"></span></div>
    </section>

    <section id="viewList" class="hidden">
      <div class="list-tools">
        <input id="q" type="search" placeholder="搜尋單字或中文" aria-label="搜尋">
        <select id="fCatSel" aria-label="分類"></select>
        <select id="fFamSel" aria-label="熟悉度">
          <option value="">全部熟悉度</option>
          <option value="0">未學習</option><option value="1">學習中</option>
          <option value="2">熟悉</option><option value="3">已掌握</option>
        </select>
        <button class="btn primary" id="btnFilterDeck"></button>
      </div>
      <div class="count" id="listCount"></div>
      <table class="tbl" id="tbl"></table>
    </section>
  </div>

  <!-- ===== cards ===== -->
  <section id="viewCards" class="hidden">
    <div class="cards-top">
      <button class="btn" id="btnBack"><span data-icon="back"></span>&nbsp;返回</button>
      <b id="cTitle"></b>
      <span class="sync" id="syncCards"></span>
    </div>
    <div class="cbar"><i id="cBar"></i></div>

    <div id="cardArea">
      <div class="swipe" id="swipe">
        <div class="stage">
          <div class="card" id="card">
            <div class="face front">
              <div class="meta"><span class="cat" id="fCat"></span></div>
              <div class="word" id="fWord"></div>
              <div class="pos" id="fPos"></div>
              <button class="speak" id="btnSpeak" type="button"><span data-icon="sound"></span>念一次</button>
              <div class="ex" id="fEx"></div>
              <div class="ex-zh" id="fExZh"></div>
            </div>
            <div class="face back">
              <div class="meta"><span class="cat" id="bWord"></span></div>
              <div class="zh" id="bZh"></div>
              <div class="def" id="bDef"></div>
              <div class="bex"><span>例句</span><div id="bEx"></div><div class="ex-zh" id="bExZh"></div></div>
              <div class="pairs">
                <div><span>同義詞</span><div id="bSyn"></div></div>
                <div><span>反義詞</span><div id="bAnt"></div></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="rate" id="rate">
        <button class="r0" data-f="0">未學習</button>
        <button class="r1" data-f="1">學習中</button>
        <button class="r2" data-f="2">熟悉</button>
        <button class="r3" data-f="3">已掌握</button>
      </div>
      <div class="nav">
        <button class="btn" id="btnPrev">上一張</button>
        <span class="pos-ind" id="posInd"></span>
        <button class="btn primary" id="btnNext">下一張 →</button>
      </div>
      <div class="kbd">空白鍵翻面 · ← → 換張 · 1–4 熟悉度 · Esc 返回</div>
    </div>

    <div id="doneArea" class="hidden">
      <div class="done-card">
        <h2 id="dTitle"></h2>
        <p id="dSub"></p>
        <button class="btn primary" id="btnMark"></button>
        <button class="btn" id="btnJump"></button>
        <button class="btn" id="btnDoneBack">← 回到最後一張</button>
      </div>
    </div>
  </section>
</div>

<!-- ===== settings ===== -->
<div class="sheet" id="sheet">
  <div class="panel">
    <h2>設定</h2>
    <div class="opt"><span>同步狀態</span><span class="sync" id="syncSettings"></span><button class="btn" id="btnRetry">重新同步</button></div>
    <div class="opt"><input id="tokenIn" type="password" autocomplete="off" placeholder="同步碼" aria-label="同步碼"><button class="btn" id="btnSaveToken">更新</button></div>
    <div class="opt"><span>發音口音</span>
      <select id="accentSel"><option value="en-GB">英式 (UK)</option><option value="en-US">美式 (US)</option></select>
    </div>
    <button class="btn primary full" id="btnIcs">加入行事曆（每天 8:00 提醒）</button>
    <p>下載後用 Google 日曆「設定 → 匯入」。若到時間沒跳通知，到該日曆的設定把「預設通知」改成活動開始時。</p>
    <button class="btn full" id="btnExport">匯出 Excel（備份）</button>
    <div class="status" id="exportStatus"></div>
    <button class="btn full" id="btnClose">關閉</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
